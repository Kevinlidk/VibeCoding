<body>
  <div class="shell">
    <aside class="cat-rail" aria-label="组件分类">
      <p class="rail-title">分类</p>
      <div class="cats" id="cats"></div>
    </aside>
    <div class="main">
    <div class="mast">
      <div class="top">
        <header class="hero">
          <h1 class="wordmark">
            <span class="wm" aria-label="Vibe Coding UI">
              <span class="wm-vibe">Vibe</span>
              <span class="wm-coding">Coding</span>
              <span class="wm-ui">UI</span>
            </span>
            <span class="wm-rest">组件<span class="title-mark">词典</span></span>
          </h1>
          <div class="intro-panel" id="introPanel">
            <button type="button" class="intro-toggle" id="introToggle" aria-expanded="true">
              <span class="intro-title">使用说明</span>
              <svg class="intro-chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="intro-body">
              <p>把脑子里的样子写成标准名称，再交给模型。卡片一样大，上面的组件可以点。复制 AI Prompt，应能直接做出同款组件。</p>
              <div class="formula">以后按这个说：<em><span class="kw kw-o">名称</span> + <span class="kw kw-g">变体</span> + <span class="kw kw-b">结构</span> + 交互 + 状态 + 动效</em>。细线跟着 Tab 走，请写 underlined tabs，不要写 slider。</div>
            </div>
          </div>
        </header>
        <div class="top-actions">
          <div class="theme-switch" role="group" aria-label="颜色模式">
            <button type="button" id="themeDark" data-mode="dark">深色</button>
            <button type="button" id="themeLight" data-mode="light">浅色</button>
          </div>
          <a class="github-link" href="https://github.com/Kevinlidk/VibeCoding" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库" title="GitHub 仓库：Kevinlidk/VibeCoding">
            <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false">

            </svg>
          </a>
        </div>
      </div>
      <div class="filters">
        <div class="toolbar">
          <input class="search" id="q" placeholder="搜中文名、英文名或别名" />
          <span class="count" id="count"></span>
        </div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    </div>
  </div>
  <button class="to-top" id="toTop" type="button" aria-label="返回顶部" title="返回顶部">↑</button>
